<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online Simple</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f4f4; padding: 20px; }
        header { background: #25D366; color: white; text-align: center; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1000px; margin: 0 auto; }
        .products { flex: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .product-card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-card h3 { font-size: 1.1rem; margin-bottom: 8px; }
        .product-card p { color: #555; font-weight: bold; margin-bottom: 12px; }
        .btn-add { background: #007bff; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
        .btn-add:hover { background: #0056b3; }

        .cart { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
        .cart h2 { margin-bottom: 15px; font-size: 1.2rem; border-bottom: 2px solid #ddd; padding-bottom: 5px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .cart-total { font-weight: bold; margin-top: 15px; border-top: 2px solid #ddd; padding-top: 10px; display: flex; justify-content: space-between; }
        .btn-checkout { background: #25D366; color: white; border: none; padding: 10px; width: 100%; margin-top: 15px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 1rem; }
        .btn-checkout:hover { background: #1ebd59; }
    </style>
</head>
<body>

    <header>
        <h1>SerbaAda_STORE</h1>
    </header>

    <div class="container">
        <!-- Daftar Produk -->
        <div class="products">
            <div class="product-card">
                <h3>Jus Mangga</h3>
                <p>Rp 12.000</p>
                <button class="btn-add" onclick="addToCart('Jus Mangga', 12000)">+ Keranjang</button>
            </div>
            <div class="product-card">
                <h3>Capung Bakar</h3>
                <p>Rp 10.000</p>
                <button class="btn-add" onclick="addToCart('Capung Bakar', 10000)">+ Keranjang</button>
            </div>
            <div class="product-card">
                <h3>Roti Bakar</h3>
                <p>Rp 15.000</p>
                <button class="btn-add" onclick="addToCart('Roti Bakar', 15000)">+ Keranjang</button>
            </div>
        </div>

        <!-- Ringkasan Keranjang -->
        <div class="cart">
            <h2>Keranjang Belanja</h2>
            <div id="cart-list">
                <p style="color: #888;">Keranjang masih kosong.</p>
            </div>
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total">Rp 0</span>
            </div>
            <button class="btn-checkout" onclick="checkoutWA()">Pesan via WhatsApp</button>
        </div>
    </div>

    <script>
        // GANTI DENGAN NOMOR WHATSAPP KAMU (Gunakan kode negara '62' tanpa '+')
        const nomorWA = "6281934424277";

        let cart = [];

        function addToCart(name, price) {
            let item = cart.find(i => i.name === name);
            if (item) {
                item.qty += 1;
            } else {
                cart.push({ name: name, price: price, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cart-list');
            const cartTotal = document.getElementById('cart-total');

            if (cart.length === 0) {
                cartList.innerHTML = '<p style="color: #888;">Keranjang masih kosong.</p>';
                cartTotal.innerText = 'Rp 0';
                return;
            }

            cartList.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                let itemTotal = item.price * item.qty;
                total += itemTotal;
                cartList.innerHTML += `
                    <div class="cart-item">
                        <span>${item.name} x ${item.qty}</span>
                        <span>Rp ${itemTotal.toLocaleString('id-ID')}</span>
                    </div>
                `;
            });

            cartTotal.innerText = `Rp ${total.toLocaleString('id-ID')}`;
        }

        function checkoutWA() {
            if (cart.length === 0) {
                alert("Keranjang kamu masih kosong!");
                return;
            }

            let text = "Halo, saya mau pesan produk berikut:\n\n";
            let total = 0;

            cart.forEach((item, index) => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                text += `${index + 1}. ${item.name} (${item.qty}x) - Rp ${subtotal.toLocaleString('id-ID')}\n`;
            });

            text += `\n*Total Bayar: Rp ${total.toLocaleString('id-ID')}*`;
            text += "\n\nMohon diproses ya, terima kasih!";

            // Mengarahkan ke API WhatsApp
            let url = `https://wa.me/${nomorWA}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
